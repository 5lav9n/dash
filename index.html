<!DOCTYPE html>
<!-- index.html — главная страница дашборда. Здесь живёт весь интерфейс -->
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <!-- viewport: чтобы сайт был удобным на телефоне (адаптивность) -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мой дашборд</title>
  <!-- Цвет системной панели телефона в тон сайту (приятно на iPhone) -->
  <meta name="theme-color" content="#f7f8fa">

  <!-- ===== PWA: чтобы сайт можно было «установить» на iPhone как приложение =====
       manifest — файл-«визитка» приложения (название, иконки, цвет фона) -->
  <link rel="manifest" href="manifest.webmanifest">
  <!-- Иконка для домашнего экрана iOS (180x180 px) -->
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <!-- Разрешаем полноэкранный режим и прячем адресную строку Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Дашборд">

  <!-- Шрифты из Google Fonts:
       Space Grotesk — современный «техно»-шрифт для заголовков,
       Inter — спокойный и очень читаемый для основного текста -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- Наши стили -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== Левая панель-«игольница»: только иконки, как в Notion или Figma ===== -->
  <aside class="sidebar">
    <div class="logo" title="Мой дашборд"><i data-lucide="sparkles"></i></div>
    <nav class="nav">
      <button class="nav-btn active" data-page="today"   title="Сегодня"><i data-lucide="sun-medium"></i><span class="nav-label">Сегодня</span></button>
      <button class="nav-btn" data-page="tasks"    title="Задачи"><i data-lucide="check-square"></i><span class="nav-label">Задачи</span></button>
      <button class="nav-btn" data-page="calendar" title="Календарь"><i data-lucide="calendar-days"></i><span class="nav-label">Календарь</span></button>
      <button class="nav-btn" data-page="notes"    title="Заметки"><i data-lucide="pen-line"></i><span class="nav-label">Заметки</span></button>
      <button class="nav-btn" data-page="habits"   title="Привычки"><i data-lucide="flame"></i><span class="nav-label">Привычки</span></button>
      <button class="nav-btn" data-page="finance"  title="Финансы"><i data-lucide="wallet"></i><span class="nav-label">Финансы</span></button>
      <button class="nav-btn" data-page="wishlist" title="Вишлист"><i data-lucide="star"></i><span class="nav-label">Вишлист</span></button>
    </nav>
    <div class="sidebar-bottom">
      <!-- Экспорт/импорт — резервные копии и перенос между устройствами -->
      <button class="nav-btn" id="export-btn" title="Скачать данные"><i data-lucide="download"></i><span class="nav-label">Скачать данные</span></button>
      <button class="nav-btn" id="import-btn" title="Загрузить данные"><i data-lucide="upload"></i><span class="nav-label">Загрузить данные</span></button>
      <input type="file" id="import-file" accept=".json" hidden>
    </div>
  </aside>

  <!-- ===== Правая часть: верхняя шапка + контент ===== -->
  <div class="main-wrap">
    <!-- Шапка: название текущего раздела слева, полезные кнопки справа -->
    <header class="topbar">
      <div class="topbar-title">
        <h1 id="topbar-heading">Сегодня</h1>
        <p id="topbar-date" class="topbar-date"></p> <!-- сегодняшнюю дату пишет JS -->
      </div>
      <div class="topbar-actions">
        <button class="btn ghost small" id="export-btn-top" title="Скачать резервную копию">
          <i data-lucide="download"></i><span class="hide-sm">Резервная копия</span>
        </button>
      </div>
    </header>

    <!-- ===== Основная область: сюда JS подставляет нужную страницу ===== -->
    <main id="app" class="content"><!-- Сюда JavaScript рисует страницы --></main>
  </div>

  <!-- Библиотека линейных иконок Lucide (обычный JS-файл, ничего устанавливать не надо).
       Если интернет вдруг недоступен — иконок просто не будет, сайт продолжит работать. -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- ===== Подключаем скрипты (порядок важен!) ===== -->
  <script src="js/app.js"></script>       <!-- дирижёр: registerPage должен быть доступен раньше модулей -->
  <script src="js/storage.js"></script>   <!-- работа с localStorage -->
  <script src="js/utils.js"></script>     <!-- мелкие вспомогательные функции -->
  <script src="js/ui.js"></script>        <!-- общие элементы интерфейса -->
  <script src="js/modules/tasks.js"></script>
  <script src="js/modules/calendar.js"></script>
  <script src="js/modules/notes.js"></script>
  <script src="js/modules/habits.js"></script>
  <script src="js/modules/finance.js"></script>
  <script src="js/modules/wishlist.js"></script>
  <script src="js/modules/today.js"></script>
  <script src="js/backup.js"></script>
</body>
</html>
